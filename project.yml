# The Xcode project is generated from this file:  xcodegen generate  &&  pod install
name: Couchmate
options:
  bundleIdPrefix: app.couchmate
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Couchmate:
    type: application
    platform: tvOS
    sources:
      - Couchmate
    info:
      path: Couchmate/Info.plist
      properties:
        CFBundleDisplayName: Couchmate
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Couchmate connects to the Couchmate server on your network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.couchmate
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        # Signing happens when installing (e.g. with TVSign) – set a team here to build signed in Xcode.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
