# Builds the Apple TV app (unsigned .ipa) on a Mac in the cloud.
# Get "Couchmate-tvOS" under Actions → the latest run → Artifacts (or from Releases) and install the .ipa with
# TVSign, which signs it with your Apple account.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Tools
        run: brew install xcodegen

      - uses: actions/cache@v4
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('Podfile') }}

      - name: Project and VLC
        run: |
          xcodegen generate
          pod install || pod install --repo-update

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Couchmate.xcworkspace \
            -scheme Couchmate \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:|warning: unre" build.log | sort -u | head -80; exit 1; }

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-appletvos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry Couchmate-tvOS.ipa Payload && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: Couchmate-tvOS
          path: out/Couchmate-tvOS.ipa
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/Couchmate-tvOS.ipa --clobber
